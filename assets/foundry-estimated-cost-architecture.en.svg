<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="okGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="840" fill="#F8FAFC"/>

  <!-- Top Header -->
  <rect x="24" y="20" width="1152" height="92" rx="14" fill="url(#hdrGrad)"/>
  <text x="48" y="56" fill="#FFFFFF" font-size="21" font-weight="700">Azure Monitor FoundryModelEstimatedCost (Preview): Architecture &amp; Empirical Audit</text>
  <text x="48" y="84" fill="#BFDBFE" font-size="12.5">Microsoft.CognitiveServices/accounts · Near-Real-Time Retail Cost Telemetry · KV-Cache &amp; SKU Uplift Aware (Verified 2026-11-23)</text>
  <rect x="954" y="40" width="198" height="50" rx="8" fill="#FFFFFF" fill-opacity="0.14" stroke="#93C5FD" stroke-opacity="0.45"/>
  <text x="1053" y="61" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">PT1M Lag ~90–130s</text>
  <text x="1053" y="79" text-anchor="middle" fill="#DBEAFE" font-size="11">0.0000% Retail Math Error</text>

  <!-- COLUMN 1: Control-Plane vs Data-Plane Telemetry Architecture -->
  <rect x="24" y="128" width="368" height="584" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="24" y="128" width="368" height="42" rx="12" fill="#EFF6FF"/>
  <rect x="24" y="156" width="368" height="14" fill="#EFF6FF"/>
  <text x="42" y="155" fill="#1E3A8A" font-size="14.5" font-weight="700">1. Data-Plane vs Control-Plane Pipeline</text>

  <!-- Data Plane Entry -->
  <rect x="42" y="182" width="332" height="106" rx="8" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="54" y="202" fill="#0369A1" font-size="12" font-weight="700">Data-Plane Inference Endpoints</text>
  <text x="54" y="221" fill="#1E293B" font-size="10.5">• Account: <tspan font-family="Consolas, monospace">/openai/deployments/&lt;dep&gt;/chat/completions</tspan></text>
  <text x="54" y="238" fill="#1E293B" font-size="10.5">• Project: <tspan font-family="Consolas, monospace">/api/projects/&lt;proj&gt;/openai/v1/...</tspan></text>
  <text x="54" y="255" fill="#475569" font-size="10">  Registered on: AIServices (Foundry) &amp; standalone OpenAI accounts</text>
  <text x="54" y="272" fill="#DC2626" font-size="10" font-weight="600">  Not registered on vertical SpeechServices accounts</text>

  <!-- Arrow -->
  <line x1="208" y1="288" x2="208" y2="308" stroke="#0078D4" stroke-width="2"/>
  <polygon points="208,314 203,305 213,305" fill="#0078D4"/>

  <!-- Internal Rating Engine -->
  <rect x="42" y="316" width="332" height="104" rx="8" fill="#1E293B"/>
  <text x="54" y="337" fill="#38BDF8" font-size="12" font-weight="700">Gateway Internal Retail Rating Engine</text>
  <text x="54" y="356" fill="#E2E8F0" font-size="10.5">• Splits <tspan fill="#5EEAD4" font-weight="700">Uncached</tspan> vs <tspan fill="#5EEAD4" font-weight="700">Cached</tspan> prompt tokens natively</text>
  <text x="54" y="373" fill="#CBD5E1" font-size="10.5">• Applies SKU multipliers (GlobalStandard vs DataZone 1.10×)</text>
  <text x="54" y="390" fill="#CBD5E1" font-size="10.5">• Covers 1P OpenAI &amp; 3P partner models (MoonshotAI/Kimi-K2.6)</text>
  <text x="54" y="407" fill="#FCD34D" font-size="10">• Basis: Public Azure Retail Rates (excludes EA/MCA/MACC discounts)</text>

  <!-- Arrow -->
  <line x1="208" y1="420" x2="208" y2="440" stroke="#0078D4" stroke-width="2"/>
  <polygon points="208,446 203,437 213,437" fill="#0078D4"/>

  <!-- Azure Monitor Platform Metrics -->
  <rect x="42" y="448" width="332" height="122" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.2"/>
  <text x="54" y="468" fill="#1D4ED8" font-size="12" font-weight="700">Control-Plane Standard Metric (Free · P93D)</text>
  <text x="54" y="486" fill="#1E293B" font-size="10.5">• Metric: <tspan font-family="Consolas, monospace" font-weight="700">FoundryModelEstimatedCost</tspan> (Models - Usage)</text>
  <text x="54" y="503" fill="#1E293B" font-size="10.5">• Aggregation: <tspan font-weight="700">Total ONLY</tspan> · PT1M..P1D · Unit: Unspecified (USD)</text>
  <text x="54" y="520" fill="#334155" font-size="10">• 5 Dimensions: ProjectId · ModelDeploymentName · ModelName ·</text>
  <text x="64" y="535" fill="#334155" font-size="10">ModelVersion · Region (Sibling: child AgentModelEstimatedCost)</text>
  <text x="54" y="554" fill="#047857" font-size="10.5" font-weight="700">✓ Validated with Azure Monitor Metric Alerts (PT5M Total)</text>

  <!-- Diagnostic Settings Warning -->
  <rect x="42" y="582" width="332" height="114" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="54" y="602" fill="#991B1B" font-size="11.5" font-weight="700">⛔ Never Rely on Diagnostic Settings → AzureMetrics</text>
  <text x="54" y="620" fill="#7F1D1D" font-size="10.5">• Official metadata marks <tspan font-family="Consolas, monospace" font-weight="700">DS Export: No</tspan></text>
  <text x="54" y="637" fill="#7F1D1D" font-size="10.5">• Even under policy-enforced AllMetrics, AzureMetrics drops all</text>
  <text x="64" y="652" fill="#7F1D1D" font-size="10.5">dimensions and dropped up to <tspan font-weight="700">95.1%</tspan> of burst data points!</text>
  <text x="54" y="672" fill="#065F46" font-size="10.5" font-weight="700">→ Always query Microsoft.Insights/metrics REST API directly</text>

  <!-- COLUMN 2: Empirical Accuracy & KV-Cache Variance -->
  <rect x="408" y="128" width="384" height="584" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="408" y="128" width="384" height="42" rx="12" fill="#F0FDFA"/>
  <rect x="408" y="156" width="384" height="14" fill="#F0FDFA"/>
  <text x="426" y="155" fill="#115E59" font-size="14.5" font-weight="700">2. Empirical Accuracy &amp; KV-Cache Proof</text>

  <!-- KV Cache Visual Comparison -->
  <rect x="426" y="182" width="348" height="176" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="438" y="202" fill="#0F172A" font-size="11.8" font-weight="700">Why It Beats DIY Token KQL: Native KV-Cache Discount</text>
  <text x="438" y="219" fill="#475569" font-size="10">Live test: gpt-4.1-mini (5 calls · 14,640 in w/ 55.1% cache hit + 52 out)</text>

  <!-- Bar 1: Naive DIY -->
  <text x="438" y="242" fill="#991B1B" font-size="10.3" font-weight="700">Naive DIY Token KQL (unsplit InputTokens): $0.00593920 (+68.73%!)</text>
  <rect x="438" y="249" width="316" height="18" rx="4" fill="#EF4444" fill-opacity="0.82"/>

  <!-- Bar 2: Retail Truth -->
  <text x="438" y="286" fill="#334155" font-size="10.3" font-weight="600">Cache-Aware Retail Math ($0.40 uncached / $0.10 cached): $0.00352000</text>
  <rect x="438" y="293" width="187" height="18" rx="4" fill="#64748B"/>

  <!-- Bar 3: FoundryModelEstimatedCost -->
  <text x="438" y="330" fill="#0F766E" font-size="10.3" font-weight="700">FoundryModelEstimatedCost Reported: $0.00352000 (0.0000% Error)</text>
  <rect x="438" y="337" width="187" height="14" rx="4" fill="url(#okGrad)"/>

  <!-- Verified Commercial Cohorts -->
  <rect x="426" y="370" width="348" height="190" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="438" y="390" fill="#166534" font-size="12" font-weight="700">✅ Verified Commercial Cohorts (0.0000% Variance)</text>
  <text x="438" y="410" fill="#1E293B" font-size="10.3">• <tspan font-weight="700">gpt-5.4</tspan> (GlobalStd $2.5/$15): 1-call $0.003100 · 121-call $0.690220</text>
  <text x="438" y="429" fill="#1E293B" font-size="10.3">• <tspan font-weight="700">gpt-5.4-mini</tspan> ($0.75/$4.5): Account &amp; Project endpoints 0.0000% err</text>
  <text x="438" y="448" fill="#1E293B" font-size="10.3">• <tspan font-weight="700">gpt-4.1 &amp; gpt-4.1-mini</tspan>: Uncached $0.002574 · 55.1% cached $0.003520</text>
  <text x="438" y="467" fill="#1E293B" font-size="10.3">• <tspan font-weight="700">MoonshotAI/Kimi-K2.6</tspan> (3P partner $0.95/$4.0): Exact w/ reasoning</text>
  <text x="438" y="486" fill="#1E40AF" font-size="10.3" font-weight="700">• SKU Uplift Awareness: GlobalStd ($4/$20) vs DataZone ($4.4/$22)</text>
  <text x="448" y="503" fill="#1E40AF" font-size="10">Measured $0.00465200 vs $0.00512160 — exact 1.10× SKU uplift</text>
  <rect x="438" y="514" width="324" height="36" rx="6" fill="#DCFCE7"/>
  <text x="600" y="536" text-anchor="middle" fill="#14532D" font-size="10.8" font-weight="700">8-Decimal Exact Match Against Retail Token Math Across All Chat Tests</text>

  <!-- Preview Blind Spots -->
  <rect x="426" y="572" width="348" height="124" rx="8" fill="#FFFBEB" stroke="#F59E0B"/>
  <text x="438" y="592" fill="#B45309" font-size="11.5" font-weight="700">⚠️ Preview Coverage Blind Spots ($0 / Excluded)</text>
  <text x="438" y="611" fill="#78350F" font-size="10.3">• <tspan font-weight="700">Embeddings</tspan>: text-embedding-3-large emitted $0 / no metric series</text>
  <text x="438" y="629" fill="#78350F" font-size="10.3">• <tspan font-weight="700">Image Generation</tspan>: FLUX.2-pro/flex &amp; gpt-image-* emitted $0</text>
  <text x="438" y="647" fill="#78350F" font-size="10.3">• <tspan font-weight="700">Non-Token Spend</tspan>: PTU hourly, Fine-Tuning, AI Search / Cosmos DB</text>
  <text x="438" y="665" fill="#92400E" font-size="10" font-weight="600">• Finance rule: Use for FinOps anomaly alerting, never invoice sign-off</text>

  <!-- COLUMN 3: FinOps Tool Positioning & Partner Pitfalls -->
  <rect x="808" y="128" width="368" height="584" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="808" y="128" width="368" height="42" rx="12" fill="#F5F3FF"/>
  <rect x="808" y="156" width="368" height="14" fill="#F5F3FF"/>
  <text x="826" y="155" fill="#4C1D95" font-size="14.5" font-weight="700">3. Enterprise FinOps Stack &amp; API Gotchas</text>

  <!-- Layer 1 -->
  <rect x="826" y="182" width="332" height="78" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.4"/>
  <rect x="836" y="191" width="114" height="20" rx="4" fill="url(#blueGrad)"/>
  <text x="893" y="205" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">Spike Alert (&lt;2m)</text>
  <text x="958" y="205" fill="#1E3A8A" font-size="11.3" font-weight="700">FoundryModelEstimatedCost</text>
  <text x="836" y="225" fill="#334155" font-size="10.3">• PT1M buckets (~90–130s lag) + PT5M Metric Alerts catch runaway loops</text>
  <text x="836" y="243" fill="#334155" font-size="10.3">• Tracks live burn rate per ModelDeploymentName &amp; ModelVersion</text>

  <!-- Layer 2 -->
  <rect x="826" y="270" width="332" height="76" rx="8" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.2"/>
  <rect x="836" y="279" width="114" height="20" rx="4" fill="#0F766E"/>
  <text x="893" y="293" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">Per-Agent Cost</text>
  <text x="958" y="293" fill="#0F766E" font-size="11.3" font-weight="700">AgentModelEstimatedCost</text>
  <text x="836" y="313" fill="#334155" font-size="10.3">• Emitted on Foundry Project child resource (<tspan font-family="Consolas, monospace">accounts/projects</tspan>)</text>
  <text x="836" y="331" fill="#334155" font-size="10.3">• Splits AgentName, AgentVersion &amp; CacheRead/Write/Uncached tokens</text>

  <!-- Layer 3 -->
  <rect x="826" y="356" width="332" height="74" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.2"/>
  <rect x="836" y="365" width="114" height="20" rx="4" fill="#6D28D9"/>
  <text x="893" y="379" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">Hard Throttling</text>
  <text x="958" y="379" fill="#5B21B6" font-size="11.3" font-weight="700">Foundry Cost Controls / APIM</text>
  <text x="836" y="399" fill="#334155" font-size="10.3">• Monitor metrics observe &amp; alert only; enforce hard budget caps via</text>
  <text x="836" y="416" fill="#334155" font-size="10.3">  Foundry Cost Controls (Preview) or APIM <tspan font-family="Consolas, monospace">llm-token-limit</tspan></text>

  <!-- Layer 4 -->
  <rect x="826" y="440" width="332" height="72" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <rect x="836" y="449" width="114" height="20" rx="4" fill="#475569"/>
  <text x="893" y="463" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">Billing Authority</text>
  <text x="958" y="463" fill="#334155" font-size="11.3" font-weight="700">Azure Cost Management (ACM)</text>
  <text x="836" y="483" fill="#334155" font-size="10.3">• 4–24h lag; reflects negotiated EA/MCA rates, MACC, PTU &amp; all modalities</text>
  <text x="836" y="500" fill="#334155" font-size="10.3">• Authoritative source for invoice reconciliation &amp; Chargeback</text>

  <!-- API Pitfalls Box -->
  <rect x="826" y="524" width="332" height="172" rx="8" fill="#FFF1F2" stroke="#FB7185" stroke-width="1.2"/>
  <text x="838" y="545" fill="#9F1239" font-size="11.8" font-weight="700">Top 3 Partner Integration Gotchas</text>
  <text x="838" y="566" fill="#881337" font-size="10.3">1. <tspan font-weight="700">HTTP 400 Dimension Mismatch</tspan>: Do not batch with InputTokens</text>
  <text x="848" y="582" fill="#881337" font-size="10">while filtering <tspan font-family="Consolas, monospace">ProjectId eq '*'</tspan> (token metrics lack ProjectId)</text>
  <text x="838" y="602" fill="#881337" font-size="10.3">2. <tspan font-weight="700">ProjectId Emits 'N/A'</tspan>: Even calls through Project OpenAI v1</text>
  <text x="848" y="618" fill="#881337" font-size="10">endpoints currently emit N/A; isolate tenants by deployment or APIM</text>
  <text x="838" y="638" fill="#881337" font-size="10.3">3. <tspan font-weight="700">Total Aggregation Only</tspan>: Selecting Average/Max in alerts or</text>
  <text x="848" y="654" fill="#881337" font-size="10">dashboards fails or returns empty; Unit Unspecified represents USD</text>
  <text x="838" y="678" fill="#0F766E" font-size="10.3" font-weight="700">Self-Test CLI: python verify_foundry_estimated_cost.py</text>

  <!-- Bottom Banner -->
  <rect x="24" y="728" width="1152" height="92" rx="12" fill="#0F172A"/>
  <text x="48" y="756" fill="#38BDF8" font-size="13.5" font-weight="700">Solution Architect Guidance (Partner Takeaway · 2026-11-23)</text>
  <text x="48" y="778" fill="#E2E8F0" font-size="11.3">1. Adopt Today: Wire Azure Monitor Metric Alerts (Total, PT5M) to FoundryModelEstimatedCost for chat/reasoning anomaly detection—eliminating 68%+ DIY cache distortion.</text>
  <text x="48" y="798" fill="#93C5FD" font-size="11.3">2. Pair Complementarily: FoundryModelEstimatedCost (&lt;2m ops guardrails) + AgentModelEstimatedCost (per-agent attribution) + Azure Cost Management (invoice &amp; multimodal).</text>
</svg>
