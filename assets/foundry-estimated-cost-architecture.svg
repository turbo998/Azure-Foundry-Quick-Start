<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" font-family="'Segoe UI', -apple-system, 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="okGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="840" fill="#F8FAFC"/>

  <!-- Top Header -->
  <rect x="24" y="20" width="1152" height="92" rx="14" fill="url(#hdrGrad)"/>
  <text x="48" y="56" fill="#FFFFFF" font-size="21.5" font-weight="700">Azure Monitor FoundryModelEstimatedCost (Preview) 架构与实测对账全图</text>
  <text x="48" y="84" fill="#BFDBFE" font-size="12.5">Microsoft.CognitiveServices/accounts · 准实时公开牌价估算 · 原生感知 KV-Cache 折扣与 DataZone 溢价 (2026-11-23 实测基线)</text>
  <rect x="960" y="40" width="192" height="50" rx="8" fill="#FFFFFF" fill-opacity="0.14" stroke="#93C5FD" stroke-opacity="0.45"/>
  <text x="1056" y="61" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">PT1M 延迟 ~90–130 秒</text>
  <text x="1056" y="79" text-anchor="middle" fill="#DBEAFE" font-size="11">实测零售价误差 0.0000%</text>

  <!-- COLUMN 1: Control-Plane vs Data-Plane Telemetry Architecture -->
  <rect x="24" y="128" width="368" height="584" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="24" y="128" width="368" height="42" rx="12" fill="#EFF6FF"/>
  <rect x="24" y="156" width="368" height="14" fill="#EFF6FF"/>
  <text x="42" y="155" fill="#1E3A8A" font-size="15" font-weight="700">1. 数据面推理与控制面计价遥测链路</text>

  <!-- Data Plane Entry -->
  <rect x="42" y="182" width="332" height="106" rx="8" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="54" y="202" fill="#0369A1" font-size="12" font-weight="700">数据面调用入口 (Data Plane Inference)</text>
  <text x="54" y="221" fill="#1E293B" font-size="10.5">• Account 端点: <tspan font-family="Consolas, monospace">/openai/deployments/&lt;dep&gt;/chat/completions</tspan></text>
  <text x="54" y="238" fill="#1E293B" font-size="10.5">• Project 端点: <tspan font-family="Consolas, monospace">/api/projects/&lt;proj&gt;/openai/v1/...</tspan></text>
  <text x="54" y="255" fill="#475569" font-size="10">  适用资源类型：AIServices (Foundry) 与独立 OpenAI 账户</text>
  <text x="54" y="272" fill="#DC2626" font-size="10" font-weight="600">  注：纯语音资源 SpeechServices 未注册该指标</text>

  <!-- Arrow -->
  <line x1="208" y1="288" x2="208" y2="308" stroke="#0078D4" stroke-width="2"/>
  <polygon points="208,314 203,305 213,305" fill="#0078D4"/>

  <!-- Internal Rating Engine -->
  <rect x="42" y="316" width="332" height="104" rx="8" fill="#1E293B"/>
  <text x="54" y="337" fill="#38BDF8" font-size="12.5" font-weight="700">网关内部实时计价引擎 (Internal Rating Engine)</text>
  <text x="54" y="356" fill="#E2E8F0" font-size="10.5">• 精确拆分 <tspan fill="#5EEAD4" font-weight="700">Uncached</tspan> 与 <tspan fill="#5EEAD4" font-weight="700">Cached</tspan> Prompt Tokens</text>
  <text x="54" y="373" fill="#CBD5E1" font-size="10.5">• 自动匹配部署 SKU 系数 (GlobalStandard vs DataZone 1.10×)</text>
  <text x="54" y="390" fill="#CBD5E1" font-size="10.5">• 覆盖 1P OpenAI 模型与 3P 伙伴模型 (如 MoonshotAI/Kimi)</text>
  <text x="54" y="407" fill="#FCD34D" font-size="10">• 计价基准：Azure 公开零售牌价 (不含 EA/MCA/MACC 协议折扣)</text>

  <!-- Arrow -->
  <line x1="208" y1="420" x2="208" y2="440" stroke="#0078D4" stroke-width="2"/>
  <polygon points="208,446 203,437 213,437" fill="#0078D4"/>

  <!-- Azure Monitor Platform Metrics -->
  <rect x="42" y="448" width="332" height="122" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.2"/>
  <text x="54" y="468" fill="#1D4ED8" font-size="12" font-weight="700">控制面标准免费指标 (Microsoft.Insights/metrics)</text>
  <text x="54" y="486" fill="#1E293B" font-size="10.5">• 指标名：<tspan font-family="Consolas, monospace" font-weight="700">FoundryModelEstimatedCost</tspan> (Models - Usage)</text>
  <text x="54" y="503" fill="#1E293B" font-size="10.5">• 聚合与粒度：仅支持 <tspan font-weight="700">Total</tspan> · PT1M ~ P1D · 免费留存 P93D</text>
  <text x="54" y="520" fill="#334155" font-size="10">• 5 维度：ProjectId · ModelDeploymentName · ModelName ·</text>
  <text x="64" y="535" fill="#334155" font-size="10">ModelVersion · Region (姊妹指标：子资源 AgentModelEstimatedCost)</text>
  <text x="54" y="554" fill="#047857" font-size="10.5" font-weight="700">✓ 原生支持 Metric Alerts (PT5M 动态/静态预算阈值告警)</text>

  <!-- Diagnostic Settings Warning -->
  <rect x="42" y="582" width="332" height="114" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="54" y="602" fill="#991B1B" font-size="11.5" font-weight="700">⛔ 严禁依赖 Diagnostic Settings 导出至 AzureMetrics</text>
  <text x="54" y="620" fill="#7F1D1D" font-size="10.5">• 官方元数据标记 <tspan font-family="Consolas, monospace" font-weight="700">DS Export: No</tspan></text>
  <text x="54" y="637" fill="#7F1D1D" font-size="10.5">• 即使策略强开 AllMetrics，Log Analytics 表也会丢失全部</text>
  <text x="64" y="652" fill="#7F1D1D" font-size="10.5">模型/部署维度，且高并发下实测漏采率高达 <tspan font-weight="700">95.1%</tspan>！</text>
  <text x="54" y="672" fill="#065F46" font-size="10.5" font-weight="700">→ 正确做法：直接查询 Metrics REST API 或配置指标告警</text>

  <!-- COLUMN 2: Empirical Accuracy & KV-Cache Variance -->
  <rect x="408" y="128" width="384" height="584" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="408" y="128" width="384" height="42" rx="12" fill="#F0FDFA"/>
  <rect x="408" y="156" width="384" height="14" fill="#F0FDFA"/>
  <text x="426" y="155" fill="#115E59" font-size="15" font-weight="700">2. 实测对账精度与 Prompt Cache 降噪价值</text>

  <!-- KV Cache Visual Comparison -->
  <rect x="426" y="182" width="348" height="176" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="438" y="202" fill="#0F172A" font-size="12" font-weight="700">核心优势：解决 DIY Token KQL 的缓存高估失真</text>
  <text x="438" y="219" fill="#475569" font-size="10">实测样本：gpt-4.1-mini (5 次调用 · 14,640 输入含 55.1% 缓存命中 + 52 输出)</text>

  <!-- Bar 1: Naive DIY -->
  <text x="438" y="242" fill="#991B1B" font-size="10.5" font-weight="700">传统 DIY Token 乘单价 (无法区分缓存)：$0.00593920 (+68.73% 虚高!)</text>
  <rect x="438" y="249" width="316" height="18" rx="4" fill="#FCA5A5"/>
  <rect x="438" y="249" width="316" height="18" rx="4" fill="#EF4444" fill-opacity="0.82"/>

  <!-- Bar 2: Retail Truth -->
  <text x="438" y="286" fill="#334155" font-size="10.5" font-weight="600">真实零售牌价公式 (Uncached $0.40 + Cached $0.10)：$0.00352000</text>
  <rect x="438" y="293" width="187" height="18" rx="4" fill="#64748B"/>

  <!-- Bar 3: FoundryModelEstimatedCost -->
  <text x="438" y="330" fill="#0F766E" font-size="10.5" font-weight="700">FoundryModelEstimatedCost 实测上报：$0.00352000 (误差 0.0000%)</text>
  <rect x="438" y="337" width="187" height="14" rx="4" fill="url(#okGrad)"/>

  <!-- Verified Commercial Cohorts -->
  <rect x="426" y="370" width="348" height="190" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="438" y="390" fill="#166534" font-size="12" font-weight="700">✅ 已核验零误差模型与计费维度 (0.0000% Error)</text>
  <text x="438" y="410" fill="#1E293B" font-size="10.5">• <tspan font-weight="700">gpt-5.4</tspan> (GlobalStd $2.5/$15)：单次 $0.003100 · 121次并发 $0.690220</text>
  <text x="438" y="429" fill="#1E293B" font-size="10.5">• <tspan font-weight="700">gpt-5.4-mini</tspan> ($0.75/$4.5)：Account 与 Project 端点均 0.0000% 误差</text>
  <text x="438" y="448" fill="#1E293B" font-size="10.5">• <tspan font-weight="700">gpt-4.1 &amp; gpt-4.1-mini</tspan>：未缓存 $0.002574 · 55.1% 缓存 $0.003520</text>
  <text x="438" y="467" fill="#1E293B" font-size="10.5">• <tspan font-weight="700">MoonshotAI/Kimi-K2.6</tspan> (3P 伙伴模型 $0.95/$4.0)：含推理 Token 精确匹配</text>
  <text x="438" y="486" fill="#1E40AF" font-size="10.5" font-weight="700">• SKU 溢价感知：GlobalStandard ($4/$20) → DataZoneStandard ($4.4/$22)</text>
  <text x="448" y="503" fill="#1E40AF" font-size="10">实测 $0.00465200 vs $0.00512160，自动精确乘入 1.10× 区域溢价系数</text>
  <rect x="438" y="514" width="324" height="36" rx="6" fill="#DCFCE7"/>
  <text x="600" y="536" text-anchor="middle" fill="#14532D" font-size="11" font-weight="700">全部已支持商用对话/推理模型与公开零售公式 8 位小数完全一致</text>

  <!-- Preview Blind Spots -->
  <rect x="426" y="572" width="348" height="124" rx="8" fill="#FFFBEB" stroke="#F59E0B"/>
  <text x="438" y="592" fill="#B45309" font-size="11.5" font-weight="700">⚠️ Preview 阶段覆盖盲区 (上报 $0 或不含项)</text>
  <text x="438" y="611" fill="#78350F" font-size="10.5">• <tspan font-weight="700">向量嵌入 (Embeddings)</tspan>：text-embedding-3-large 实测无费用序列</text>
  <text x="438" y="629" fill="#78350F" font-size="10.5">• <tspan font-weight="700">图像生成 (Image Gen)</tspan>：FLUX.2-pro/flex、gpt-image-* 实测上报 $0</text>
  <text x="438" y="647" fill="#78350F" font-size="10.5">• <tspan font-weight="700">非按量项</tspan>：PTU 预留小时费、微调训练/托管费、Search/Cosmos 下游费</text>
  <text x="438" y="665" fill="#92400E" font-size="10" font-weight="600">• 财务定位：用于运维异常熔断与趋势监控，绝不可直接替代月末财务账单</text>

  <!-- COLUMN 3: FinOps Tool Positioning & Partner Pitfalls -->
  <rect x="808" y="128" width="368" height="584" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="808" y="128" width="368" height="42" rx="12" fill="#F5F3FF"/>
  <rect x="808" y="156" width="368" height="14" fill="#F5F3FF"/>
  <text x="826" y="155" fill="#4C1D95" font-size="15" font-weight="700">3. 企业 FinOps 四层分工与集成避坑</text>

  <!-- Layer 1 -->
  <rect x="826" y="182" width="332" height="78" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.4"/>
  <rect x="836" y="191" width="110" height="20" rx="4" fill="url(#blueGrad)"/>
  <text x="891" y="205" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">分钟级异常告警</text>
  <text x="954" y="205" fill="#1E3A8A" font-size="11.5" font-weight="700">FoundryModelEstimatedCost</text>
  <text x="836" y="225" fill="#334155" font-size="10.5">• 延迟 &lt; 2 分钟 (PT1M)，配合 Metric Alerts (PT5M) 抓死循环</text>
  <text x="836" y="243" fill="#334155" font-size="10.5">• 按 ModelDeploymentName 拆分多模型公开牌价实时燃烧率</text>

  <!-- Layer 2 -->
  <rect x="826" y="270" width="332" height="76" rx="8" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.2"/>
  <rect x="836" y="279" width="110" height="20" rx="4" fill="#0F766E"/>
  <text x="891" y="293" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">单 Agent 归因</text>
  <text x="954" y="293" fill="#0F766E" font-size="11.5" font-weight="700">AgentModelEstimatedCost</text>
  <text x="836" y="313" fill="#334155" font-size="10.5">• 位于 Foundry Project 子资源 (<tspan font-family="Consolas, monospace">accounts/projects</tspan>)</text>
  <text x="836" y="331" fill="#334155" font-size="10.5">• 原生带 AgentName / AgentVersion 与缓存读写 Token 拆分指标</text>

  <!-- Layer 3 -->
  <rect x="826" y="356" width="332" height="74" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.2"/>
  <rect x="836" y="365" width="110" height="20" rx="4" fill="#6D28D9"/>
  <text x="891" y="379" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">硬性配额与熔断</text>
  <text x="954" y="379" fill="#5B21B6" font-size="11.5" font-weight="700">Foundry Cost Controls / APIM</text>
  <text x="836" y="399" fill="#334155" font-size="10.5">• Azure Monitor 指标本身只告警不阻断流量；需硬截断时配置</text>
  <text x="836" y="416" fill="#334155" font-size="10.5">  Foundry Cost Controls (Preview) 或 APIM <tspan font-family="Consolas, monospace">llm-token-limit</tspan></text>

  <!-- Layer 4 -->
  <rect x="826" y="440" width="332" height="72" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <rect x="836" y="449" width="110" height="20" rx="4" fill="#475569"/>
  <text x="891" y="463" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">财务出账与分摊</text>
  <text x="954" y="463" fill="#334155" font-size="11.5" font-weight="700">Azure Cost Management (ACM)</text>
  <text x="836" y="483" fill="#334155" font-size="10.5">• 延迟 4–24 小时，含 EA/MCA 谈判折扣、MACC 抵扣、PTU 及全模态</text>
  <text x="836" y="500" fill="#334155" font-size="10.5">• 作为正式发票对账与跨部门 Chargeback 唯一财务权威源</text>

  <!-- API Pitfalls Box -->
  <rect x="826" y="524" width="332" height="172" rx="8" fill="#FFF1F2" stroke="#FB7185" stroke-width="1.2"/>
  <text x="838" y="545" fill="#9F1239" font-size="12" font-weight="700">合作伙伴 API 集成三大高频踩坑</text>
  <text x="838" y="566" fill="#881337" font-size="10.5">1. <tspan font-weight="700">HTTP 400 维度冲突</tspan>：切勿将 FoundryModelEstimatedCost 与</text>
  <text x="848" y="582" fill="#881337" font-size="10">InputTokens 合并查询并加 <tspan font-family="Consolas, monospace">ProjectId eq '*'</tspan>（后者无此维度）</text>
  <text x="838" y="602" fill="#881337" font-size="10.5">2. <tspan font-weight="700">ProjectId 现阶段恒为 'N/A'</tspan>：即使经 Project OpenAI v1</text>
  <text x="848" y="618" fill="#881337" font-size="10">端点调用仍报 N/A；租户级分摊请用独立部署名或 APIM Header</text>
  <text x="838" y="638" fill="#881337" font-size="10.5">3. <tspan font-weight="700">仅支持 Total 聚合</tspan>：告警规则或 Grafana 面板若误选</text>
  <text x="848" y="654" fill="#881337" font-size="10">Average / Max 会返回空值或校验失败；单位 Unspecified 即 USD</text>
  <text x="838" y="678" fill="#0F766E" font-size="10.5" font-weight="700">配套工具：运行 verify_foundry_estimated_cost.py 一键自检</text>

  <!-- Bottom Banner -->
  <rect x="24" y="728" width="1152" height="92" rx="12" fill="#0F172A"/>
  <text x="48" y="756" fill="#38BDF8" font-size="13.5" font-weight="700">架构师落地建议 (Partner Recommendation · 2026-11-23)</text>
  <text x="48" y="778" fill="#E2E8F0" font-size="11.5">1. 立即启用场景：在生产 AIServices / OpenAI 账户上基于 FoundryModelEstimatedCost (Total, PT5M) 配置 Azure Monitor 预算突增告警，替代高估达 68%+ 的手写 Token KQL。</text>
  <text x="48" y="798" fill="#93C5FD" font-size="11.5">2. 组合双保险：实时监控用 FoundryModelEstimatedCost (&lt;2 min) + Agent 归因用 AgentModelEstimatedCost + 财务结算与图像/向量全覆盖用 Azure Cost Management。</text>
</svg>
