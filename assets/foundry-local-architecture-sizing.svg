<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="'Segoe UI', -apple-system, 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="npuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="#F8FAFC"/>

  <!-- Top Header -->
  <rect x="24" y="20" width="1152" height="92" rx="14" fill="url(#hdrGrad)"/>
  <text x="48" y="56" fill="#FFFFFF" font-size="22" font-weight="700">Microsoft Foundry Local 端侧推理架构、EP 优先级路由与统一内存规划</text>
  <text x="48" y="84" fill="#BFDBFE" font-size="13">Microsoft Foundry on Windows · 进程内原生 Core API (~20 MB) · Windows ML 2.x 动态 EP · Copilot+ PC 32 GB 参考基线 (2026-11-19)</text>
  <rect x="978" y="42" width="174" height="46" rx="8" fill="#FFFFFF" fill-opacity="0.14" stroke="#93C5FD" stroke-opacity="0.4"/>
  <text x="1065" y="62" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">CLI v0.14.0 · Win11 24H2+</text>
  <text x="1065" y="79" text-anchor="middle" fill="#DBEAFE" font-size="11">Build &gt;= 26100 · 零云端依赖</text>

  <!-- COLUMN 1: In-Process Runtime Architecture -->
  <rect x="24" y="128" width="368" height="564" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="24" y="128" width="368" height="42" rx="12" fill="#EFF6FF"/>
  <rect x="24" y="156" width="368" height="14" fill="#EFF6FF"/>
  <text x="44" y="155" fill="#1E3A8A" font-size="15" font-weight="700">1. 进程内原生架构栈 (In-Process Stack)</text>

  <!-- Layer 1A: App Host -->
  <rect x="42" y="184" width="212" height="86" rx="8" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="54" y="205" fill="#0369A1" font-size="12.5" font-weight="700">应用宿主进程 (推荐主路径)</text>
  <text x="54" y="224" fill="#334155" font-size="11">• C# (.NET 9 / .NET 10 WinML)</text>
  <text x="54" y="241" fill="#334155" font-size="11">• Python 3.11+ / JS / Rust / C++</text>
  <text x="54" y="258" fill="#0284C7" font-size="10.5" font-weight="600">直接函数调用 · 零 HTTP 序列化开销</text>

  <!-- Layer 1B: Optional CLI/REST -->
  <rect x="262" y="184" width="112" height="86" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="4,3" stroke-width="1.2"/>
  <text x="318" y="204" text-anchor="middle" fill="#475569" font-size="11.5" font-weight="700">可选 CLI / 服务</text>
  <text x="318" y="222" text-anchor="middle" fill="#64748B" font-size="10">foundry v0.14.0</text>
  <text x="318" y="238" text-anchor="middle" fill="#64748B" font-size="10">OpenAI REST 兼容</text>
  <text x="318" y="255" text-anchor="middle" fill="#475569" font-size="9.5">--port 39839</text>

  <!-- Arrow down -->
  <line x1="208" y1="270" x2="208" y2="292" stroke="#0078D4" stroke-width="2"/>
  <polygon points="208,298 203,289 213,289" fill="#0078D4"/>

  <!-- Layer 2: Core API -->
  <rect x="42" y="300" width="332" height="92" rx="8" fill="#1E293B"/>
  <text x="56" y="323" fill="#38BDF8" font-size="13" font-weight="700">Foundry Local Core API (~20 MB 原生动态库)</text>
  <text x="56" y="343" fill="#E2E8F0" font-size="11">• Windows (.dll) / Linux (.so) / macOS (.dylib)</text>
  <text x="56" y="361" fill="#CBD5E1" font-size="11">• 模型生命周期：别名解析 → 按需下载 → 缓存 → 加载/卸载</text>
  <text x="56" y="379" fill="#CBD5E1" font-size="11">• 线程安全 ChatSession · KV-Cache 管理 · 自动硬件探测</text>

  <!-- Arrow down -->
  <line x1="208" y1="392" x2="208" y2="414" stroke="#0078D4" stroke-width="2"/>
  <polygon points="208,420 203,411 213,411" fill="#0078D4"/>

  <!-- Layer 3: ORT + OGA + WinML -->
  <rect x="42" y="422" width="332" height="118" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.2"/>
  <text x="56" y="444" fill="#1D4ED8" font-size="12.5" font-weight="700">ONNX Runtime + GenAI (OGA) + Windows ML 2.x</text>
  <rect x="54" y="454" width="150" height="74" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="64" y="472" fill="#1E40AF" font-size="11" font-weight="700">Windows ML 动态注册</text>
  <text x="64" y="489" fill="#475569" font-size="10">• ExecutionProviderCatalog</text>
  <text x="64" y="504" fill="#475569" font-size="10">• 按硬件拉取 IHV EP 插件</text>
  <text x="64" y="519" fill="#475569" font-size="10">• 驱动兼容性校验与协商</text>

  <rect x="212" y="454" width="150" height="74" rx="6" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="222" y="472" fill="#1E40AF" font-size="11" font-weight="700">Foundry 模型目录</text>
  <text x="222" y="489" fill="#475569" font-size="10">• foundrylocal.ai 云端注册表</text>
  <text x="222" y="504" fill="#475569" font-size="10">• 首次联网拉取，离线运行</text>
  <text x="222" y="519" fill="#475569" font-size="10">• 预编译量化 ONNX 变体</text>

  <!-- Package Guardrail Box -->
  <rect x="42" y="554" width="332" height="122" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="56" y="575" fill="#B45309" font-size="12" font-weight="700">工程接入避坑要点 (SDK &amp; 运行时)</text>
  <text x="56" y="595" fill="#78350F" font-size="10.5">1. C# 仅装 .NET 10 时：将 csproj 目标框架改为</text>
  <text x="66" y="611" fill="#92400E" font-size="10.5" font-family="Consolas, monospace">net10.0-windows10.0.26100.0</text>
  <text x="56" y="629" fill="#78350F" font-size="10.5">2. Python 严禁混装：仅装 foundry-local-sdk-winml，</text>
  <text x="66" y="645" fill="#78350F" font-size="10.5">勿同环境装 foundry-local-sdk (onnxruntime-core 冲突)</text>
  <text x="56" y="663" fill="#DC2626" font-size="10.5" font-weight="600">3. 勿装 PyPI 上的 foundry-local (无 -sdk 属第三方包)</text>

  <!-- COLUMN 2: Deterministic EP Priority Ladder -->
  <rect x="408" y="128" width="384" height="564" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="408" y="128" width="384" height="42" rx="12" fill="#F0FDFA"/>
  <rect x="408" y="156" width="384" height="14" fill="#F0FDFA"/>
  <text x="428" y="155" fill="#115E59" font-size="15" font-weight="700">2. EP 确定性优先级路由与驱动门槛</text>

  <!-- P0 NPU -->
  <rect x="426" y="184" width="348" height="114" rx="8" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.5"/>
  <rect x="436" y="194" width="112" height="22" rx="5" fill="url(#npuGrad)"/>
  <text x="492" y="209" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">PRIORITY_NPU = 0</text>
  <text x="556" y="209" fill="#0F766E" font-size="12" font-weight="700">专用 NPU 最高优先级</text>
  <text x="438" y="230" fill="#1E293B" font-size="11">• <tspan font-weight="700">QNN (高通)</tspan>: X Elite/Plus Hexagon · 驱动 &gt;= 30.0.140.0</text>
  <text x="448" y="246" fill="#0F766E" font-size="10.5">目录含 13 款 (QuaRot+GPTQ)：phi-4-mini-reasoning (2.78G) 等</text>
  <text x="438" y="264" fill="#334155" font-size="10.5">• <tspan font-weight="700">OpenVINO NPU</tspan>: Intel 15代 ArrowLake+ (&gt;= 32.0.100.4239)</text>
  <text x="438" y="281" fill="#334155" font-size="10.5">• <tspan font-weight="700">VitisAI NPU</tspan>: AMD Adrenalin 25.6.3–25.9.1 (32.00.0203.280+)</text>

  <!-- P1 Vendor GPU -->
  <rect x="426" y="308" width="348" height="92" rx="8" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.3"/>
  <rect x="436" y="318" width="144" height="22" rx="5" fill="url(#gpuGrad)"/>
  <text x="508" y="333" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">PRIORITY_VENDOR_GPU = 1</text>
  <text x="588" y="333" fill="#4338CA" font-size="12" font-weight="700">厂商原生 GPU</text>
  <text x="438" y="354" fill="#1E293B" font-size="11">• <tspan font-weight="700">NvTensorRTRTX / CUDA</tspan>: RTX 30XX+ · &gt;= 32.0.15.5585 · CUDA 12.5</text>
  <text x="438" y="372" fill="#334155" font-size="10.5">• <tspan font-weight="700">OpenVINO GPU</tspan>: Intel 12代 AlderLake+ (&gt;= 32.0.101.1029)</text>
  <text x="438" y="389" fill="#4F46E5" font-size="10.5">目录含 58 款 CUDA / 16 款 TensorRT-RTX / 18 款 OpenVINO GPU</text>

  <!-- P2 Generic GPU (WebGPU) -->
  <rect x="426" y="410" width="348" height="98" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.3"/>
  <rect x="436" y="420" width="148" height="22" rx="5" fill="#7C3AED"/>
  <text x="510" y="435" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">PRIORITY_GENERIC_GPU = 2</text>
  <text x="592" y="435" fill="#5B21B6" font-size="12" font-weight="700">通用 WebGPU</text>
  <text x="438" y="456" fill="#1E293B" font-size="11">• <tspan font-weight="700">WebGpuExecutionProvider</tspan>: Google Dawn → D3D12 / Metal</text>
  <text x="438" y="474" fill="#5B21B6" font-size="10.5" font-weight="600">★ 骁龙 X Elite 关键路由：phi-4-mini 暂无 QNN 变体，自动落入</text>
  <text x="448" y="490" fill="#5B21B6" font-size="10.5" font-weight="600">Adreno X1-85 GPU (3.72 GB 磁盘 / 3.74 GB VRAM, 共 43 款 RTN)</text>

  <!-- P3/P4 CPU -->
  <rect x="426" y="518" width="348" height="86" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <rect x="436" y="528" width="136" height="22" rx="5" fill="#475569"/>
  <text x="504" y="543" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">PRIORITY_CPU = 3 / 4</text>
  <text x="580" y="543" fill="#334155" font-size="12" font-weight="700">CPU 兜底与语音模型</text>
  <text x="438" y="564" fill="#334155" font-size="10.5">• P3 OpenVINO CPU (11代 TigerLake+ &gt;= 32.0.100.9565)</text>
  <text x="438" y="581" fill="#334155" font-size="10.5">• P4 CPUExecutionProvider (MLAS x64/arm64, 59 款含 Whisper ASR)</text>
  <text x="438" y="597" fill="#DC2626" font-size="10">注：5 款旧版 generic-cpu 变体在 ARM64 上标记为不支持</text>

  <!-- Alias Rule Callout -->
  <rect x="426" y="614" width="348" height="62" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
  <text x="438" y="635" fill="#065F46" font-size="11.5" font-weight="700">最佳实践：始终传入模型别名 (Alias) 而非完整 ID</text>
  <text x="438" y="653" fill="#047857" font-size="10.5">调用 GetModelAsync("phi-4-mini-reasoning") 自动按 P0→P4 匹配最优</text>
  <text x="438" y="668" fill="#047857" font-size="10.5">硬件变体；仅在强制对比基准时才指定 *-generic-cpu 完整 ID。</text>

  <!-- COLUMN 3: Copilot+ PC 32GB Unified Memory Sizing -->
  <rect x="808" y="128" width="368" height="564" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <rect x="808" y="128" width="368" height="42" rx="12" fill="#F5F3FF"/>
  <rect x="808" y="156" width="368" height="14" fill="#F5F3FF"/>
  <text x="828" y="155" fill="#4C1D95" font-size="15" font-weight="700">3. Copilot+ PC 32 GB 统一内存容量规划</text>

  <!-- Reference Hardware Box -->
  <rect x="826" y="184" width="332" height="82" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="838" y="203" fill="#0F172A" font-size="11.5" font-weight="700">参考机型基线 (Surface Laptop 7 · ARM64)</text>
  <text x="838" y="220" fill="#334155" font-size="10.5">• SoC: Snapdragon X Elite X1E80100 (12 核) · Win11 Build 26300</text>
  <text x="838" y="236" fill="#0F766E" font-size="10.5" font-weight="600">• NPU: Hexagon 45 TOPS (驱动 30.0.220.3000 &gt;= 30.0.140.0 ✓)</text>
  <text x="838" y="252" fill="#4F46E5" font-size="10.5" font-weight="600">• GPU: Adreno X1-85 (驱动 31.0.133.1 ✓) · 32 GB LPDDR5x 统一内存</text>

  <!-- Unified Memory Bar -->
  <text x="826" y="286" fill="#1E293B" font-size="12" font-weight="700">32.0 GB 统一内存池切分示意 (CPU + NPU + GPU 共享)</text>
  <rect x="826" y="296" width="332" height="30" rx="6" fill="#E2E8F0"/>
  <rect x="826" y="296" width="166" height="30" rx="6" fill="#64748B"/>
  <rect x="988" y="296" width="88" height="30" fill="#0D9488"/>
  <rect x="1076" y="296" width="42" height="30" fill="#F59E0B"/>
  <rect x="1118" y="296" width="40" height="30" rx="6" fill="#16A34A"/>
  <text x="907" y="315" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">OS + IDE/浏览器 (16G)</text>
  <text x="1032" y="315" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">模型权重</text>
  <text x="1097" y="315" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="700">KV</text>
  <text x="1138" y="315" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="700">余量</text>

  <text x="826" y="344" fill="#B45309" font-size="10.5" font-weight="600">安全公式：所需空闲内存 &gt;= 模型占用 + KV 缓存(1~1.5G) + 3.0G 系统护栏</text>

  <!-- Tier 1: Sweet Spot -->
  <rect x="826" y="358" width="332" height="96" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="838" y="378" fill="#166534" font-size="11.5" font-weight="700">✅ 黄金甜点档 (0.43 – 3.74 GB · 日常多任务常驻无忧)</text>
  <text x="838" y="396" fill="#1E293B" font-size="10.5">• <tspan font-weight="700">phi-4-mini-reasoning</tspan>: 2.78 GB (QNN NPU · 推理首选)</text>
  <text x="838" y="413" fill="#1E293B" font-size="10.5">• <tspan font-weight="700">phi-3.5-mini / deepseek-r1-7b</tspan>: 2.02 GB / 3.71 GB (QNN NPU)</text>
  <text x="838" y="430" fill="#1E293B" font-size="10.5">• <tspan font-weight="700">phi-4-mini / qwen3-4b</tspan>: 3.74 GB / 2.87 GB (Adreno WebGPU)</text>
  <text x="838" y="446" fill="#15803D" font-size="10">• <tspan font-weight="700">whisper-large-v3-turbo / parakeet-tdt-0.6b</tspan>: 1.25 / 0.68 GB (CPU)</text>

  <!-- Tier 2: Medium -->
  <rect x="826" y="464" width="332" height="90" rx="8" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="838" y="484" fill="#1E40AF" font-size="11.5" font-weight="700">⚡ 进阶主力档 (5.5 – 7.3 GB · 建议预留 &gt;= 11 GB 空闲内存)</text>
  <text x="838" y="502" fill="#1E293B" font-size="10.5">• <tspan font-weight="700">qwen2.5-coder-7b / qwen2.5-7b</tspan>: 7.08 / 6.81 GB (QNN NPU)</text>
  <text x="838" y="519" fill="#1E293B" font-size="10.5">• <tspan font-weight="700">deepseek-r1-14b</tspan>: 7.12 GB (QNN NPU 4-bit 高压缩比红利!)</text>
  <text x="838" y="536" fill="#1E293B" font-size="10.5">• <tspan font-weight="700">qwen3.5-9b (视觉) / mistral-nemo-12b</tspan>: 6.98 / 7.29 GB (WebGPU)</text>

  <!-- Tier 3: Heavy -->
  <rect x="826" y="564" width="332" height="112" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="838" y="584" fill="#991B1B" font-size="11.5" font-weight="700">⚠️ 重载挑战档 (8.3 – 11.8 GB · 需先清理高提交内存应用)</text>
  <text x="838" y="602" fill="#1E293B" font-size="10.5">• <tspan font-weight="700">phi-4 / phi-4-reasoning</tspan>: 8.37 GB / 8.38 GB (Adreno WebGPU)</text>
  <text x="838" y="619" fill="#1E293B" font-size="10.5">• <tspan font-weight="700">qwen3-14b / gpt-oss-20b</tspan>: 9.93 GB / 11.78 GB (Adreno WebGPU)</text>
  <text x="838" y="638" fill="#B91C1C" font-size="10">排障提示：若系统已提交内存 (Commit Charge) 逼近上限或与系统级</text>
  <text x="838" y="653" fill="#B91C1C" font-size="10">Copilot+ 特性争用上下文，NPU 会报 QNN Error 5005 (重启或释放内存)</text>

  <!-- Bottom Summary Banner -->
  <rect x="24" y="708" width="1152" height="90" rx="12" fill="#0F172A"/>
  <text x="48" y="736" fill="#38BDF8" font-size="13.5" font-weight="700">架构师速查结论 (SA Key Takeaways · 2026-11-19 实测目录核验)</text>
  <text x="48" y="758" fill="#E2E8F0" font-size="11.5">1. 32 GB 骁龙 X Elite 完全满足 Foundry Local 硬件门槛：Hexagon NPU 驱动 (30.0.220.3000) 与 Windows 11 Build 26300 均大幅高于最低要求。</text>
  <text x="48" y="778" fill="#93C5FD" font-size="11.5">2. 区分两款易混模型：Windows 内置 Phi Silica 走 Windows AI APIs (受限访问需令牌，后续由 Aion Instruct 接替)；Foundry Local 无需令牌且支持 60+ 开源模型别名。</text>
</svg>
